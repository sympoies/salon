name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: salon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Scaffold validation
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Private-phase repository-scoped runner; switch to GitHub-hosted before public launch.
    runs-on: [self-hosted, sympoies, salon, ci, ephemeral]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned devlog
        timeout-minutes: 3
        env:
          DEVLOG_ARCHIVE_URL: https://github.com/sympoies/nils-cli/releases/download/v1.31.16/nils-cli-v1.31.16-x86_64-unknown-linux-gnu.tar.gz
          DEVLOG_ARCHIVE_SHA256: 366b9a33448ce025355802368deffbfde820ea7606b1ede88ff88c9eecd235e7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/devlog-release.tar.gz"
          install_dir="$(mktemp -d "$RUNNER_TEMP/devlog.XXXXXX")"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            "$DEVLOG_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$DEVLOG_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" --strip-components=2 --wildcards '*/bin/devlog'
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Validate scaffold
        run: bash .agents/scripts/pre-pr.sh

      - name: Record validation result
        if: always()
        env:
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATED_COMMIT: ${{ github.sha }}
        run: |
          printf 'Scaffold validation: %s\nCommit: %s\n' "$VALIDATION_RESULT" "$VALIDATED_COMMIT"
          printf 'Scaffold validation: **%s**\n\nCommit: %s\n' \
            "$VALIDATION_RESULT" "$VALIDATED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
