name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: salon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan and cheap checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, sympoies, salon, ci, ephemeral]
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      tree: ${{ steps.plan.outputs.tree }}
      suites: ${{ steps.plan.outputs.suites }}
      reused_run: ${{ steps.plan.outputs.reused_run }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan validation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validation/ci_scope.py --github

      - name: Install pinned devlog
        if: steps.plan.outputs.reused_run == ''
        timeout-minutes: 3
        env:
          DEVLOG_ARCHIVE_URL: https://github.com/sympoies/nils-cli/releases/download/v1.31.16/nils-cli-v1.31.16-x86_64-unknown-linux-gnu.tar.gz
          DEVLOG_ARCHIVE_SHA256: 366b9a33448ce025355802368deffbfde820ea7606b1ede88ff88c9eecd235e7
          # bin/devlog extracted only after verifying the archive above.
          DEVLOG_BINARY_SHA256: 15bf6270984eb7d35a6d9cd9568cc8f667201f72ddb4e5c3868c1e308fc95b73
        run: |
          set -euo pipefail
          if installed="$(command -v devlog)" &&
             printf '%s  %s\n' "$DEVLOG_BINARY_SHA256" "$installed" | sha256sum --check --status; then
            "$installed" --version >> "$GITHUB_STEP_SUMMARY"
            printf 'Using the verified pinned devlog image binary.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          archive="$RUNNER_TEMP/devlog-release.tar.gz"
          install_dir="$(mktemp -d "$RUNNER_TEMP/devlog.XXXXXX")"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            "$DEVLOG_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$DEVLOG_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" --strip-components=2 --wildcards '*/bin/devlog'
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Run cheap checks
        if: steps.plan.outputs.reused_run == ''
        run: bash .agents/scripts/pre-pr.sh --suite cheap

  suites:
    name: Validate ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: [self-hosted, sympoies, salon, ci, ephemeral]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          cache: false

      - name: Probe preinstalled Chrome
        id: chrome
        if: (matrix.suite == 'ui-browser' || matrix.suite == 'core')
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null &&
             timeout 20 google-chrome --headless --no-sandbox --disable-gpu \
               --user-data-dir="$RUNNER_TEMP/chrome-image-probe" --dump-dom about:blank \
               > "$RUNNER_TEMP/chrome-image-probe.html"; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            printf 'CHROME_BIN=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install headless Chrome runtime libraries
        if: (matrix.suite == 'ui-browser' || matrix.suite == 'core') && steps.chrome.outputs.ready != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Chrome 156's pinned Debian package Depends, using Ubuntu 24.04's
          # t64 package names and the libcurl4 / GTK 3 dependency alternatives.
          # These packages live only in this disposable job container.
          chrome_runtime_packages=(
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0t64
            libatk1.0-0t64 libatspi2.0-0t64 libc6 libcairo2 libcups2t64 libcurl4t64
            libdbus-1-3 libexpat1 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4
            libnss3 libpango-1.0-0 libudev1 libvulkan1 libx11-6 libxcb1
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
            wget xdg-utils
          )
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends "${chrome_runtime_packages[@]}"
          {
            printf '### Chrome runtime packages\n\n```text\n'
            dpkg-query -W -f='${binary:Package}\t${Version}\n' "${chrome_runtime_packages[@]}"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select and probe headless Chrome
        if: (matrix.suite == 'ui-browser' || matrix.suite == 'core') && steps.chrome.outputs.ready != 'true'
        env:
          CHROME_DEB_URL: https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_156.0.8078.47-1_amd64.deb
          CHROME_DEB_SHA256: 6c92cd22e90c6e3e255d782991543fa2091db8614e8536a971a7433a5c4d7ac8
        run: |
          set -euo pipefail
          chrome_bin=""
          for candidate in google-chrome chromium; do
            if candidate_path="$(command -v "$candidate")"; then
              printf '%s: %s\n' "$candidate" "$candidate_path" >> "$GITHUB_STEP_SUMMARY"
              "$candidate_path" --version | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ -z "$chrome_bin" ]]; then chrome_bin="$candidate_path"; fi
            else
              printf '%s: absent\n' "$candidate" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ -z "$chrome_bin" ]]; then
            # Official Google package index SHA256, pinned with this workflow.
            archive="$RUNNER_TEMP/chrome.deb"
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
              "$CHROME_DEB_URL" --output "$archive"
            printf '%s  %s\n' "$CHROME_DEB_SHA256" "$archive" | sha256sum --check --status
            {
              printf '### Pinned Chrome dependency metadata\n\n```text\n'
              dpkg-deb --field "$archive" Depends
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            dpkg-deb --extract "$archive" "$RUNNER_TEMP/chrome"
            chrome_bin="$RUNNER_TEMP/chrome/opt/google/chrome/chrome"
            "$chrome_bin" --version | tee -a "$GITHUB_STEP_SUMMARY"
            printf 'Official Chrome package SHA256: %s\n' "$CHROME_DEB_SHA256" >> "$GITHUB_STEP_SUMMARY"
          fi
          "$chrome_bin" --headless --no-sandbox --disable-gpu \
            --user-data-dir="$RUNNER_TEMP/chrome-probe" --dump-dom about:blank \
            > "$RUNNER_TEMP/chrome-probe.html"
          printf 'CHROME_BIN=%s\n' "$chrome_bin" >> "$GITHUB_ENV"
          printf 'Headless Chrome startup probe passed.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Run validation suite
        env:
          VALIDATION_SUITE: ${{ matrix.suite }}
        run: bash .agents/scripts/pre-pr.sh --suite "$VALIDATION_SUITE"

  validate:
    name: Core package validation
    needs: [plan, suites]
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, sympoies, salon, ci, ephemeral]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require all selected checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
          SELECTED_SUITES: ${{ needs.plan.outputs.suites }}
          REUSED_RUN: ${{ needs.plan.outputs.reused_run }}
          VALIDATION_SCOPE: ${{ needs.plan.outputs.scope }}
        run: python3 scripts/validation/ci_result.py

      - name: "Full suite passed: ${{ needs.plan.outputs.tree }}"
        if: needs.plan.outputs.scope == 'full' && needs.plan.outputs.reused_run == ''
        run: echo 'All validation suites passed.'
