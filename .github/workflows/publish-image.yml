name: Publish image

# Builds the single-container Salon image for linux/amd64 only and pushes it to
# GHCR under the repository namespace. The Dockerfile also accepts arm64, but
# an emulated arm64 build is not part of this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.3
        required: true
        type: string

permissions: {}

concurrency:
  group: salon-image-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?$ ]] || {
            echo "Tag must look like v1.2.3" >&2
            exit 1
          }

      - name: Check out the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Name the image
        id: ref
        run: printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}:${{ env.TAG }}
          provenance: false

      - name: Summarize the pinned reference
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf '### Pinned image\n\n```text\n%s@%s\n```\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  record-digest:
    name: Record digest in release notes
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Append the pinned reference to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REFERENCE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$(gh release view "$TAG" --json body --jq .body)"
          if grep -qxF "$REFERENCE" <<<"$notes"; then exit 0; fi
          if grep -qxF '## Container image' <<<"$notes"; then
            echo 'Container image section already records a different pinned reference; release notes were not changed.' >&2
            exit 1
          fi
          {
            printf '%s\n\n## Container image\n\n' "$notes"
            printf 'Pin this immutable reference in `SALON_IMAGE`:\n\n```text\n%s\n```\n' "$REFERENCE"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
