services:
  workspace:
    build: .
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - workspace:/home/node/Project/workspace
      - provider-state:/home/node/.codex
      - runtime-state:/home/node/.local/state
    tmpfs:
      - /tmp:mode=1777
      - /run/salon:uid=1000,gid=1000,mode=0700
    working_dir: /home/node/Project/workspace
    stop_grace_period: 15s
    mem_limit: 6g
    memswap_limit: 6g
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/healthz]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  workspace:
  provider-state:
  runtime-state:
